<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f3" />
    <title>Pixelle P1 Ops Loop Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f6f3;
        --panel: #ffffff;
        --soft: #f9faf7;
        --ink: #17201b;
        --muted: #667269;
        --line: #dfe4dd;
        --line-soft: #edf0eb;
        --accent: #2f6f5e;
        --accent-ink: #17493e;
        --accent-soft: #e3f1eb;
        --warn: #8b5c13;
        --warn-soft: #fff3d8;
        --mock: #7255a3;
        --shadow: 0 24px 70px rgba(31, 41, 34, 0.1);
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(47, 111, 94, 0.08), transparent 34%),
          linear-gradient(180deg, #fff 0, var(--bg) 48%);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        letter-spacing: 0;
        overflow-x: hidden;
        -webkit-tap-highlight-color: rgba(47, 111, 94, 0.16);
      }

      button {
        font: inherit;
      }

      .skip-link {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        transform: translateY(-160%);
        padding: 8px 10px;
        border-radius: 7px;
        background: var(--ink);
        color: #fff;
        text-decoration: none;
      }

      .skip-link:focus-visible {
        transform: translateY(0);
        outline: 3px solid rgba(47, 111, 94, 0.28);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        min-height: 100svh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100svh;
        padding: 26px 18px;
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(20px);
      }

      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 30px;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 7px;
        background: var(--ink);
        color: #fff;
        font-weight: 800;
      }

      .brand-title {
        font-weight: 760;
      }

      .brand-subtitle {
        margin-top: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .nav {
        display: grid;
        gap: 4px;
      }

      .nav a,
      .nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 38px;
        padding: 0 10px;
        color: var(--muted);
        text-decoration: none;
        border-radius: 7px;
        font-size: 14px;
      }

      .nav-item {
        opacity: 0.72;
      }

      .nav a.active {
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 700;
      }

      .sidebar-footer {
        position: absolute;
        right: 18px;
        bottom: 24px;
        left: 18px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .main {
        min-width: 0;
        padding: 26px 32px 36px;
      }

      .topbar {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
      }

      .project-line {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .project-title {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        font-weight: 780;
      }

      .page-note {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 26px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .pill.strong {
        border-color: transparent;
        background: var(--accent-soft);
        color: var(--accent-ink);
        font-weight: 720;
      }

      .pill.mock {
        border-color: rgba(114, 85, 163, 0.18);
        background: rgba(114, 85, 163, 0.1);
        color: var(--mock);
        font-weight: 680;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .button {
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        touch-action: manipulation;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
        font-weight: 720;
      }

      .button.primary:hover:not(:disabled) {
        border-color: var(--accent-ink);
        background: var(--accent-ink);
        color: #fff;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .button:hover:not(:disabled),
      .cycle-button:hover,
      .tab:hover,
      .load-more:hover,
      .step:hover {
        border-color: rgba(47, 111, 94, 0.32);
        background-color: var(--accent-soft);
        color: var(--accent-ink);
      }

      .button:active:not(:disabled),
      .cycle-button:active,
      .tab:active,
      .step:active {
        transform: translateY(1px);
      }

      .button:focus-visible,
      .cycle-button:focus-visible,
      .tab:focus-visible,
      .step:focus-visible,
      .load-more:focus-visible {
        outline: 3px solid rgba(47, 111, 94, 0.2);
        outline-offset: 2px;
      }

      .layout {
        display: grid;
        grid-template-columns: 300px minmax(560px, 1fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
      }

      .panel.flat {
        box-shadow: none;
      }

      .panel-header {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 16px 16px 12px;
        border-bottom: 1px solid var(--line-soft);
      }

      .panel-title {
        margin: 0;
        font-size: 15px;
        font-weight: 760;
      }

      .panel-note {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .cycle-rail {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line-soft);
      }

      .cycle-button {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr);
        gap: 10px;
        width: 100%;
        padding: 10px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        background: var(--soft);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .cycle-button.active {
        border-color: rgba(47, 111, 94, 0.36);
        background: var(--accent-soft);
      }

      .cycle-number {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 999px;
        background: #fff;
        color: var(--accent-ink);
        font-size: 12px;
        font-weight: 800;
      }

      .cycle-topic {
        display: -webkit-box;
        overflow: hidden;
        font-size: 13px;
        font-weight: 740;
        line-height: 1.35;
        overflow-wrap: anywhere;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .cycle-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
      }

      .load-more {
        min-height: 34px;
        border: 1px dashed var(--line);
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        touch-action: manipulation;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      .loop {
        padding: 10px 12px 14px;
      }

      .step {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 10px;
        position: relative;
        width: 100%;
        padding: 8px 6px 8px 0;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .step:not(:last-child)::before {
        position: absolute;
        top: 34px;
        bottom: -10px;
        left: 13px;
        width: 2px;
        background: var(--line);
        content: "";
      }

      .dot {
        z-index: 1;
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 12px;
        font-weight: 760;
      }

      .step.done .dot {
        border-color: transparent;
        background: var(--accent);
        color: #fff;
      }

      .step.mock .dot {
        border-color: transparent;
        background: var(--mock);
        color: #fff;
      }

      .step.current .dot {
        border: 2px solid var(--accent);
        background: #fff;
        color: var(--accent-ink);
      }

      .step.missing .dot {
        border-style: dashed;
        background: #fff;
        color: var(--muted);
      }

      .step.selected {
        border-color: rgba(47, 111, 94, 0.22);
        background: var(--accent-soft);
      }

      .step.mock.selected {
        border-color: rgba(114, 85, 163, 0.22);
        background: rgba(114, 85, 163, 0.08);
      }

      .step-title {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
        margin: 1px 0 3px;
        font-size: 13px;
        font-weight: 730;
      }

      .step-badge {
        display: inline-flex;
        align-items: center;
        min-height: 18px;
        padding: 0 6px;
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 10px;
        font-weight: 760;
        white-space: nowrap;
      }

      .step.mock .step-badge {
        background: rgba(114, 85, 163, 0.12);
        color: var(--mock);
      }

      .step-body {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .step.current .step-title {
        color: var(--accent-ink);
      }

      .workspace {
        min-height: 430px;
      }

      .workspace-hero {
        padding: 20px 20px 18px;
      }

      .stage-kicker {
        margin-bottom: 8px;
        color: var(--accent-ink);
        font-size: 13px;
        font-weight: 760;
      }

      .stage-title {
        margin: 0;
        max-width: 660px;
        font-size: 30px;
        line-height: 1.15;
        font-weight: 820;
        overflow-wrap: anywhere;
        text-wrap: balance;
      }

      .stage-summary {
        margin: 14px 0 0;
        max-width: 700px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .object-detail {
        display: grid;
        gap: 12px;
        padding: 0 20px 18px;
      }

      .object-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(190px, 0.55fr);
        gap: 12px;
      }

      .object-card {
        padding: 14px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        background: var(--soft);
      }

      .object-card.wide {
        grid-column: 1 / -1;
      }

      .object-card-title {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .object-card-value {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 800;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .object-card-body {
        margin-top: 8px;
        color: #26312b;
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .inspector-panel {
        margin: 0 20px 18px;
        border: 1px solid rgba(47, 111, 94, 0.18);
        border-radius: var(--radius);
        background: linear-gradient(180deg, #fff, var(--soft));
      }

      .inspector-panel[hidden] {
        display: none;
      }

      .inspector-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 14px 14px 10px;
        border-bottom: 1px solid var(--line-soft);
      }

      .inspector-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .mini-preview {
        display: grid;
        gap: 10px;
        min-height: 170px;
        place-items: center;
        padding: 12px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.2)),
          repeating-linear-gradient(
            45deg,
            #eef2ed 0,
            #eef2ed 10px,
            #f8faf7 10px,
            #f8faf7 20px
          );
      }

      .mini-phone {
        display: grid;
        width: 84px;
        height: 136px;
        place-items: center;
        padding: 10px 8px;
        border: 6px solid #202722;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 14px 34px rgba(31, 41, 34, 0.14);
      }

      .mini-phone-title {
        text-align: center;
        font-size: 10px;
        font-weight: 760;
        line-height: 1.3;
      }

      .mini-phone-line {
        width: 44px;
        height: 3px;
        margin: 8px auto 0;
        border-radius: 999px;
        background: var(--accent);
      }

      .mini-preview-label {
        justify-self: start;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .next-box {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 16px;
        align-items: center;
        margin: 0 20px 18px;
        padding: 16px;
        border: 1px solid rgba(139, 92, 19, 0.18);
        border-radius: var(--radius);
        background: var(--warn-soft);
      }

      .readonly .next-box {
        border-color: rgba(114, 85, 163, 0.2);
        background: rgba(114, 85, 163, 0.08);
      }

      .next-label {
        color: var(--warn);
        font-size: 12px;
        font-weight: 760;
      }

      .readonly .next-label {
        color: var(--mock);
      }

      .next-title {
        margin-top: 3px;
        font-size: 16px;
        font-weight: 780;
        line-height: 1.45;
      }

      .evidence-checklist {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 20px 0;
      }

      .status-chip {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        min-height: 28px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .status-chip.done {
        border-color: rgba(47, 111, 94, 0.18);
        background: var(--accent-soft);
        color: var(--accent-ink);
      }

      .status-chip.mock {
        border-color: rgba(114, 85, 163, 0.18);
        background: rgba(114, 85, 163, 0.1);
        color: var(--mock);
      }

      .status-chip.pending {
        border-color: rgba(139, 92, 19, 0.22);
        background: var(--warn-soft);
        color: var(--warn);
      }

      .evidence-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        padding: 18px 20px 20px;
      }

      .metric {
        padding: 12px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        background: var(--soft);
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
      }

      .metric-value {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 790;
        font-variant-numeric: tabular-nums;
      }

      .context-list {
        display: grid;
        gap: 10px;
        padding: 14px 16px 16px;
      }

      .context-row {
        display: grid;
        gap: 3px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line-soft);
      }

      .context-row:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .context-label {
        color: var(--muted);
        font-size: 12px;
      }

      .context-value {
        font-size: 13px;
        line-height: 1.5;
      }

      .context-row.blocker .context-value {
        color: var(--warn);
        font-weight: 720;
      }

      .context-row.pass .context-value {
        color: var(--accent-ink);
        font-weight: 720;
      }

      .detail-tabs {
        margin-top: 18px;
      }

      .detail-tabs summary {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        min-height: 58px;
        padding: 0 16px;
        cursor: pointer;
        list-style: none;
      }

      .detail-tabs summary::-webkit-details-marker {
        display: none;
      }

      .drawer-title {
        font-size: 15px;
        font-weight: 760;
      }

      .drawer-meta {
        color: var(--muted);
        font-size: 12px;
      }

      .detail-tabs:not([open]) {
        box-shadow: none;
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 12px 14px 0;
      }

      .tab {
        min-height: 32px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 7px 7px 0 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        touch-action: manipulation;
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease;
      }

      .tab.active {
        border-color: var(--line);
        border-bottom-color: #fff;
        background: #fff;
        color: var(--ink);
        font-weight: 740;
      }

      .tab-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
        padding: 16px;
        border-top: 1px solid var(--line);
      }

      .copy-block {
        margin: 0;
        padding: 14px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        background: var(--soft);
        color: #26312b;
        font-size: 13px;
        line-height: 1.65;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .asset-preview {
        display: grid;
        min-height: 210px;
        place-items: center;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.2)),
          repeating-linear-gradient(
            45deg,
            #eef2ed 0,
            #eef2ed 10px,
            #f8faf7 10px,
            #f8faf7 20px
          );
      }

      .phone {
        display: grid;
        width: 118px;
        height: 186px;
        place-items: center;
        padding: 14px 10px;
        border: 8px solid #202722;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 40px rgba(31, 41, 34, 0.16);
      }

      .phone-title {
        text-align: center;
        font-size: 12px;
        font-weight: 760;
        line-height: 1.35;
      }

      .phone-line {
        width: 64px;
        height: 4px;
        margin: 10px auto 0;
        border-radius: 999px;
        background: var(--accent);
      }

      @media (max-width: 1180px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 860px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
          padding: 16px;
        }

        .sidebar-footer {
          position: static;
          margin-top: 18px;
        }

        .main {
          padding: 18px 16px 28px;
        }

        .topbar,
        .next-box {
          align-items: stretch;
          flex-direction: column;
        }

        .layout,
        .tab-body,
        .object-grid,
        .inspector-list,
        .evidence-strip {
          grid-template-columns: 1fr;
        }

        .stage-title {
          font-size: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>
    <div class="shell">
      <aside class="sidebar" aria-label="主导航">

        const params = new URLSearchParams(window.location.search);
        const roundParam = params.get("round");
        const cycle =
          cycles.find((item) => String(item.round) === roundParam || item.id === roundParam) ||
          cycles[0];
        const tabParam = params.get("tab");
        return {
          cycleId: cycle.id,
          tabId: tabIds.has(tabParam) ? tabParam : cycle.defaultTab,
        };
      }

        const params = new URLSearchParams();
        params.set("round", String(selected.round));
        params.set("tab", activeTab);
        const nextUrl = `${window.location.pathname}?${params.toString()}`;
        window.history.replaceState(null, "", nextUrl);
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function getEvidenceStatus(selected, label) {
        const item = selected.evidence.find(([name]) => name === label);
        if (!item) return ["missing", "缺失"];
        return [item[1], item[2]];
      }

              body:
                status === "mock"
                  ? "这只能证明链路通，不能当作真实小红书发布。"
                  : status === "pending"
                    ? "缺小红书链接、post id、Buffer id 或平台返回结果。"
                    : "已经有真实平台证据，可以进入观测。",
            },
            {
              title: "需要补齐",
              value: "平台 URL 或 Post ID",
              body: "Buffer ID 或平台返回结果可作为辅助证据；发布登记只看平台侧证据。",
            },
          ];
        }

        if (activeTab === "retro") {
          return [
            {
              title: "指标快照",
              value: status === "mock" ? "Mock 指标" : status === "pending" ? "待观测" : "已回收",
              body: status === "pending" ? "没有发布证据时，不给出表现判断。" : "只保留能支撑复盘的关键指标。",
            },
            {
              title: "复盘结论",
              value: status === "mock" ? "Mock 复盘" : status === "pending" ? "待复盘" : "已写入",
              body: selected.details.retro || "复盘应该回答预测是否命中，以及为什么。",
              wide: true,
            },
            {
              title: "写回项目记忆",
              value: readonly ? "影响下一轮" : "待观测后写回",
              body: "复盘的真正价值是驱动下一轮选题和预测，不是单条视频归档。",
            },
          ];
        }

        return [];
      }

      function renderObjectDetails(selected, stepView) {
        const cards = getObjectCards(selected, stepView);
        document.querySelector("#objectDetail").innerHTML = `
          <div class="object-grid">
            ${cards
              .map((card) => {
                if (card.preview) {
                  return `
                    <div class="mini-preview" aria-label="${escapeHtml(card.title)}">
                      <div class="mini-preview-label">${escapeHtml(card.title)}</div>
                      <div class="mini-phone">
                        <div>
                          <div class="mini-phone-title">${escapeHtml(selected.topic).replace("，", "<br />")}</div>
                          <div class="mini-phone-line"></div>
                        </div>
                      </div>
                    </div>
                  `;
                }

                return `
                  <div class="object-card${card.wide ? " wide" : ""}">
                    <div class="object-card-title">${escapeHtml(card.title)}</div>
                    <div class="object-card-value">${escapeHtml(card.value)}</div>
                    <div class="object-card-body">${escapeHtml(card.body)}</div>
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
      }

      function getStepView(selected) {
        const view = stepViews[activeTab] || stepViews[selected.defaultTab] || stepViews.publish;
        const [status, statusText] = getEvidenceStatus(selected, view.evidence);
        const isReadonly = selected.mode === "history";
        const statusPrefix =
          status === "mock" ? "Mock" : status === "pending" ? "缺口" : status === "done" ? "已完成" : "缺失";
        const action =
          isReadonly && selected.round !== cycles[0].round
            ? selected.historyImpact || "这轮已经结束；继续处理请回到当前轮。"
            : view.action;
        const actionLabel =
          isReadonly && selected.round !== cycles[0].round ? "对当前轮影响" : view.actionLabel;

        return {
          ...view,
          status,
          statusText,
          isReadonly,
          statusPrefix,
          action,
          actionLabel,
          title: `《${selected.topic}》${view.title}`,
          kicker: `${isReadonly ? "历史轮" : "当前轮"} · 步骤 ${view.step} · ${view.label}`,
          inspectorRows: [...view.rows],
        };
      }

      function renderCycleRail(selected) {
        const rail = document.querySelector("#cycleRail");
        if (!cycles.length) {
          rail.innerHTML = '<div class="page-note">暂无内容轮次。先在 Codex 里创建新一轮。</div>';
          return;
        }

        rail.innerHTML = cycles
          .map((cycle) => {
            const active = cycle.id === selected.id ? " active" : "";
            const mode = cycle.mode === "current" ? "当前" : "历史";
            return `
              <button class="cycle-button${active}" type="button" data-cycle="${cycle.id}" aria-pressed="${cycle.id === selected.id}">
                <span class="cycle-number">R${cycle.round}</span>
                <span>
                  <span class="cycle-topic">${escapeHtml(cycle.topic)}</span>
                  <span class="cycle-meta">
                    <span>${mode}</span>
                    <span>${escapeHtml(cycle.status)}</span>
                  </span>
                </span>
              </button>
            `;
          })
          .join("");
        rail.insertAdjacentHTML("beforeend", '<button class="load-more" type="button">加载更早轮次</button>');
        rail.querySelectorAll("[data-cycle]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedCycleId = button.getAttribute("data-cycle");
            activeTab = byId.get(selectedCycleId)?.defaultTab || tabs[0].id;
            render();
          });
        });
      }

      function renderLoop(selected) {
        document.querySelector("#loopNote").textContent =
          selected.mode === "current"
            ? `当前卡在第 ${selected.stage} 步：${steps[selected.stage - 1].title}`
            : selected.completed >= 6
              ? `历史第 ${selected.round} 轮已收口，6 步证据完整`
              : `历史第 ${selected.round} 轮停在第 ${selected.stage} 步，缺口直接显示`;

        document.querySelector("#loopSteps").innerHTML = steps
          .map((step, index) => {
            const number = index + 1;
            const isMock = selected.mockSteps.includes(number);
            const isDone = number <= selected.completed && !isMock;
            const isCurrent = selected.mode === "current" && number === selected.stage;
            const isMissing = number > selected.completed && !isCurrent && !isMock;
            const isSelected = activeTab === step.tab;
            let state = "";
            if (isMock) state = "mock";
            else if (isCurrent) state = "current";
            else if (isDone) state = "done";
            else if (isMissing) state = "missing";

            const badge = isMock
              ? "Mock"
              : isCurrent
                ? "当前"
                : isMissing
                  ? "缺失"
                  : "";

            return `
              <button class="step ${state}${isSelected ? " selected" : ""}" type="button" data-tab="${step.tab}" aria-pressed="${isSelected}">
                <div class="dot">${number}</div>
                <div>
                  <div class="step-title">
                    <span>${step.title}</span>
                    ${badge ? `<span class="step-badge">${badge}</span>` : ""}
                  </div>
                  <div class="step-body">${step.body}</div>
                </div>
              </button>
            `;
          })
          .join("");

        document.querySelectorAll("#loopSteps [data-tab]").forEach((button) => {
          button.addEventListener("click", () => {
            activeTab = button.getAttribute("data-tab");
            render();
            document.querySelector("#workspace").focus({ preventScroll: true });
          });
        });
      }

      function renderWorkspace(selected) {
        const readonly = selected.mode === "history";
        const stepView = getStepView(selected);
        document.querySelector("#currentPill").textContent = `当前运营轮：R${cycles[0].round}`;
        document.querySelector("#viewPill").textContent = `正在查看：R${selected.round}`;
        document.querySelector("#modePill").textContent = readonly ? "历史轮已结束" : "当前可操作轮";
        document.querySelector("#modePill").className = readonly ? "pill mock" : "pill";
        document.querySelector("#workspace").classList.toggle("readonly", readonly);
        document.querySelector("#copyAction").disabled = readonly;
        document.querySelector("#stageKicker").textContent = stepView.kicker;
        document.querySelector("#stageTitle").textContent = stepView.title;
        document.querySelector("#stageSummary").textContent = stepView.summary;
        renderObjectDetails(selected, stepView);
        document.querySelector("#nextLabel").textContent = stepView.actionLabel;
        document.querySelector("#nextTitle").textContent = stepView.action;
        document.querySelector("#nextButton").textContent = readonly ? "回到当前轮" : "复制下一步指令";
        document.querySelector("#nextButton").onclick = () => {
          if (readonly) {
            selectedCycleId = cycles[0].id;
            activeTab = cycles[0].defaultTab;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
            return;
          }

          document.querySelector("#statusLive").textContent =
            "可直接回 Codex 询问下一步；兜底上下文只用于定位当前轮。";
        };
        document.querySelector("#nextButton").className = "button primary";
        document.querySelector("#copyAction").onclick = () => {
          document.querySelector("#statusLive").textContent =
            readonly ? "这轮已经结束，直接回 Codex 查看后续状态。" : "已复制当前轮兜底上下文。";
        };
      }

      function renderInspector(selected) {
        const stepView = getStepView(selected);
        const panel = document.querySelector("#inspectorPanel");
        const rows = stepView.inspectorRows || [];
        panel.hidden = rows.length === 0;
        if (!rows.length) return;

        document.querySelector("#inspectorTitle").textContent = stepView.contextTitle;
        document.querySelector("#inspectorNote").textContent = stepView.contextNote;
        document.querySelector("#inspectorBadge").textContent =
          `${stepView.statusPrefix} · ${stepView.statusText}`;
        document.querySelector("#inspectorBadge").className =
          stepView.status === "mock"
            ? "pill mock"
            : stepView.status === "done"
              ? "pill strong"
              : "pill";
        document.querySelector("#inspectorRows").innerHTML = rows
          .map(([label, value]) => {
            const isBlocker = /阻塞|缺口|风险|不能|Mock/.test(`${label}${value}`);
            const isPass = /标准|通过|真实完成|已完成|可信/.test(`${label}${value}`);
            return `
              <div class="context-row ${isBlocker ? "blocker" : isPass ? "pass" : ""}">
                <div class="context-label">${escapeHtml(label)}</div>
                <div class="context-value">${escapeHtml(value)}</div>
              </div>
            `;
          })
          .join("");
      }

      function renderDetails(selected) {
        const detail = selected.details[activeTab] || selected.details[selected.defaultTab];
        document.querySelector("#detailCopy").textContent = detail;
      }

      function render() {
        const selected = byId.get(selectedCycleId) || cycles[0];
        if (!tabIds.has(activeTab)) activeTab = selected.defaultTab;
        syncUrl(selected);
        renderCycleRail(selected);
        renderLoop(selected);
        renderWorkspace(selected);
        renderInspector(selected);
        renderDetails(selected);
        document.querySelector("#statusLive").textContent =
          `正在查看第 ${selected.round} 轮，当前证据标签是 ${tabs.find((tab) => tab.id === activeTab)?.label || "详情"}。`;
      }

      const initial = getInitialState();
      selectedCycleId = initial.cycleId;
      activeTab = initial.tabId;
      render();
    </script>
  </body>
</html>
